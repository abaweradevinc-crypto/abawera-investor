name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
    - name: Force Java 17
      run: |
        echo "JAVA_HOME="
        java -version
        javac -version
    - name: Install Buildozer
      run: pip install buildozer cython virtualenv
    - name: Build APK
      continue-on-error: true
      env:
        GRADLE_OPTS: "-Xmx4096m -Dorg.gradle.daemon=false"
        JAVA_OPTS: "-Xmx4096m"
      run: yes | buildozer android debug 2>&1 | tee build.log | tail -200
    - name: Find APK
      if: always()
      run: |
        find . -name "*.apk" -type f || echo no-apk
    - name: Build Log Tail
      if: always()
      run: |
        if [ -f build.log ]; then tail -100 build.log; fi
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: abawera-apk
        path: "**/*.apk"
        if-no-files-found: warn
