name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
    - name: Install Buildozer
      run: pip install buildozer cython virtualenv
    - name: Build APK
      env:
        GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"
        JAVA_OPTS: "-Xmx4096m"
      run: |
        # Inject gradle.properties into the p4a build dir BEFORE gradle runs
        mkdir -p .buildozer/android/platform/build-arm64-v8a/dists
        cat > /tmp/gradle.properties << 'GPEOF'
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
        org.gradle.daemon=false
        org.gradle.parallel=false
        org.gradle.configureondemand=false
        android.useAndroidX=true
        android.enableJetifier=true
        GPEOF
        # Start build
        yes | buildozer android debug 2>&1 | tail -300 || true
        # Copy gradle.properties into any newly created dist dir
        find .buildozer -name gradlew -exec dirname {} \; | while read d; do
          cp /tmp/gradle.properties "/gradle.properties" 2>/dev/null || true
        done
        # If first attempt failed, retry with patched gradle.properties
        yes | buildozer android debug 2>&1 | tail -300 || true
    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: abawera-apk
        path: bin/*.apk
        if-no-files-found: warn
