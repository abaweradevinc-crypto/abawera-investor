name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev coreutils
    - name: Pre-install modern Android cmdline-tools
      run: |
        SDK=/home/runner/.buildozer/android/platform/android-sdk
        mkdir -p 
        cd 
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/NOTICE.txt cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
        mkdir -p tools/bin
        ln -sf /cmdline-tools/latest/bin/sdkmanager tools/bin/sdkmanager
        ln -sf /cmdline-tools/latest/bin/avdmanager tools/bin/avdmanager
        echo y | /cmdline-tools/latest/bin/sdkmanager --sdk_root= --licenses > /dev/null 2>&1 || true
        /cmdline-tools/latest/bin/sdkmanager --sdk_root= "platform-tools" "platforms;android-33" "build-tools;33.0.2"
    - name: Install Buildozer
      run: pip install buildozer cython virtualenv
    - name: Build APK
      continue-on-error: true
      env:
        GRADLE_OPTS: "-Xmx4096m -Dorg.gradle.daemon=false"
        JAVA_OPTS: "-Xmx4096m"
      run: yes | buildozer android debug 2>&1 | tee build.log | tail -200 || true
    - name: Find APK
      if: always()
      run: |
        find . -name "*.apk" -type f || echo no-apk
    - name: Build Log Tail
      if: always()
      run: |
        if [ -f build.log ]; then tail -100 build.log; fi
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: abawera-apk
        path: "**/*.apk"
        if-no-files-found: warn
